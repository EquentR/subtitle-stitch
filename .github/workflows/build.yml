name: build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner image already ships a usable Android SDK. We use it
      # directly instead of android-actions/setup-android, because that action
      # requests the legacy "tools" package, which no longer exists in the
      # repository and makes sdkmanager fail.
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found" >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using SDK at $SDK"

      - name: Install SDK packages
        run: |
          # pick whichever cmdline-tools the image provides
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKM="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          # the build-tools zip does not always carry the executable bit
          find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f \
            \( -name aapt2 -o -name zipalign -o -name apksigner -o -name d8 \) \
            -exec chmod +x {} +

      - name: Run unit tests
        run: |
          chmod +x test.sh
          ./test.sh

      - name: Build APK
        run: |
          chmod +x build.sh
          ./build.sh --out "$RUNNER_TEMP/build"

      - name: Verify signature
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | head -1)"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/build/SubtitleStitch.apk"

      - name: Show APK info
        run: |
          AAPT2="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | head -1)"
          "$AAPT2" dump badging "$RUNNER_TEMP/build/SubtitleStitch.apk" | head -5
          ls -lh "$RUNNER_TEMP/build/SubtitleStitch.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleStitch-debug-apk
          path: ${{ runner.temp }}/build/SubtitleStitch.apk
          if-no-files-found: error
