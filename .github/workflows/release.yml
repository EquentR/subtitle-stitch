name: release

# Builds a signed APK from a version tag and attaches it to a GitHub Release.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The tag drives the APK's versionName (the leading "v" is stripped) and
# versionCode (major*10000 + minor*100 + patch).
#
# SIGNING: this workflow signs with a throwaway debug keystore generated per
# run, which is fine for testing the pipeline but means the signature changes
# every build -- users cannot upgrade in place. To publish a durable release,
# add these repository secrets and the workflow will use them instead:
#   KEYSTORE_BASE64   base64 of a PKCS#12 keystore
#   KEYSTORE_PASS     store password
#   KEYSTORE_ALIAS    key alias
# See README "正式签名" for how to create one.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version from tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not of the form vX.Y.Z"; exit 1 ;;
          esac
          VER="${TAG#v}"
          MAJOR="${VER%%.*}"
          REST="${VER#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "name=$VER"    >> "$GITHUB_OUTPUT"
          echo "code=$CODE"   >> "$GITHUB_OUTPUT"
          echo "Building $TAG -> versionName=$VER versionCode=$CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::Android SDK not found"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKM="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          # build.sh falls back to whatever is already installed if this fails
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-36" "build-tools;36.0.0" || true

      - name: Run unit tests
        run: |
          chmod +x test.sh
          ./test.sh

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the keystore from repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            KS_SIZE=$(wc -c < "$RUNNER_TEMP/release.p12" | tr -d ' ')
            echo "decoded keystore: $KS_SIZE bytes"
            if [ "$KS_SIZE" -lt 100 ]; then
              echo "::error::decoded keystore is only $KS_SIZE bytes -- the KEYSTORE_BASE64 secret looks wrong"
              exit 1
            fi
            # fail early with a clear message if the alias/password do not match
            if ! keytool -list -keystore "$RUNNER_TEMP/release.p12" \
                    -storetype PKCS12 -storepass "$KEYSTORE_PASS" \
                    -alias "$KEYSTORE_ALIAS" > /dev/null 2>&1; then
              echo "::error::cannot open the keystore with the given alias/password"
              echo "aliases present:"
              keytool -list -keystore "$RUNNER_TEMP/release.p12" \
                  -storetype PKCS12 -storepass "$KEYSTORE_PASS" 2>&1 | head -20 || true
              exit 1
            fi
            echo "keystore OK (alias: $KEYSTORE_ALIAS)"
            {
              echo "STITCH_KEYSTORE=$RUNNER_TEMP/release.p12"
              echo "STITCH_KS_PASS=${KEYSTORE_PASS:-android}"
              echo "STITCH_KS_ALIAS=${KEYSTORE_ALIAS:-release}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set -- signing with a debug key."
            echo "::warning::Users cannot upgrade in place across such builds."
          fi

      - name: Build release APK
        env:
          STITCH_VERSION_NAME: ${{ steps.version.outputs.name }}
          STITCH_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x build.sh
          ./build.sh --release --out "$RUNNER_TEMP/build"

      - name: Verify signature and metadata
        run: |
          APK="$RUNNER_TEMP/build/SubtitleStitch.apk"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -1)"
          AAPT2="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT2" dump badging "$APK" | head -3
          # the tag must have made it into the manifest
          "$AAPT2" dump badging "$APK" | grep -q "versionName='${{ steps.version.outputs.name }}'" \
            || { echo "::error::versionName does not match the tag"; exit 1; }

      - name: Name the artifacts
        run: |
          VER="${{ steps.version.outputs.name }}"
          cp "$RUNNER_TEMP/build/SubtitleStitch.apk" \
             "$RUNNER_TEMP/build/SubtitleStitch-$VER.apk"
          ( cd "$RUNNER_TEMP/build" && sha256sum "SubtitleStitch-$VER.apk" \
              > "SubtitleStitch-$VER.apk.sha256" )
          cat "$RUNNER_TEMP/build/SubtitleStitch-$VER.apk.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            APK for `${{ steps.version.outputs.tag }}`.

            - `versionName`: `${{ steps.version.outputs.name }}`
            - `versionCode`: `${{ steps.version.outputs.code }}`
            - Minimum Android 10 (API 29)

            Signed build. Verify the download with the attached `.sha256` file.
          files: |
            ${{ runner.temp }}/build/SubtitleStitch-${{ steps.version.outputs.name }}.apk
            ${{ runner.temp }}/build/SubtitleStitch-${{ steps.version.outputs.name }}.apk.sha256
          fail_on_unmatched_files: true
